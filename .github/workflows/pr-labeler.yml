name: PR 自动打标签

# 用 pull_request_target 是为了让来自 fork 的 PR 也拿得到写标签的权限。
# 这里的两个 action 都只读 PR 的文件清单、不检出也不执行 PR 里的代码，所以是安全的。
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# 同一 PR 的多次更新依次打标，避免不同轮次交错添加、删除 size 标签。
concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  label-by-files:
    name: 按改动文件贴 scope 标签
    runs-on: ubuntu-latest
    steps:
      - name: 按 .github/labeler.yml 的映射贴标签
        # https://github.com/actions/labeler
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  label-by-size:
    name: 按改动规模贴大小标签（不含测试）
    # 排在 scope 标签之后，避免两个 job 同时写标签互相覆盖
    needs: [label-by-files]
    runs-on: ubuntu-latest
    if: always()

    # 打标签走的是 issues API，要额外给 issues 写权限
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: 统计增删行数并贴标签（只算测试以外的改动）
        # https://github.com/CodelyTV/pr-size-labeler
        # 新版会明确删除旧 size 标签；旧版只 POST 添加，更新后会越积越多。
        uses: codelytv/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644 # v1.12.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: '🟢 ■□□□□'
          xs_max_size: '50'
          s_label: '🟢 ■■□□□'
          s_max_size: '500'
          m_label: '🟡 ■■■□□'
          m_max_size: '1000'
          l_label: '🟠 ■■■■□'
          l_max_size: '2500'
          xl_label: '🔴 ■■■■■'
          # 超大 PR 只贴标签，不拦合并
          fail_if_xl: 'false'
          message_if_xl: ''
          # 这个标签衡量的是「需要人肉 review 的实现改动有多大」，所以下面几类都不计入：
          #   1. 构建产物和锁文件 —— 不然一次 pnpm install 就直接顶到 XL
          #   2. 测试文件 —— 补测试是好事，不该让 PR 因为测试写得多就被贴成大 PR
          # 匹配规则是 action 内部的 bash `[[ $filename == $pattern ]]`（见 src/github.sh），
          # 注意它是普通字符串通配、不是 pathname 展开，所以 `*` 会跨 `/`：
          # `*.test.ts` 能盖住 utils/memoryPalace/embedding.test.ts 这种嵌套路径，不用写 `**`。
          files_to_ignore: |
            "pnpm-lock.yaml"
            "public/*.bundle.js"
            "dist/*"
            "*.test.ts"
            "*.test.tsx"
            "*.spec.ts"
            "*.spec.tsx"
            "test/*"
            "*/test/*"
            "tests/*"
            "*/tests/*"
            "__tests__/*"
            "*/__tests__/*"
            "test-setup.ts"
            "vitest.config.ts"
