name: Deploy canary site to Cloudflare

# canary 通道：先把 Worker 成品包同步到部署仓库的 canary 分支，再部署 canary 前端。
# 顺序照总纲「Worker 先于前端」：新 Worker 配旧前端是允许的方向，反过来不行。
# 同步失败就不部署前端。详见 docs/canary-channel.md。

on:
  push:
    branches: [canary]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-canary
  # Do not interrupt a deployed release before its assets have been saved.
  cancel-in-progress: false

jobs:
  sync-worker:
    if: github.ref == 'refs/heads/canary'
    uses: ./.github/workflows/sync-workers-repo.yml
    with:
      target_branch: canary
    secrets: inherit

  deploy:
    needs: sync-worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      RELEASE_CHANNEL: canary
      CLOUDFLARE_ACCOUNT_ID: 2cd975a0e2a9d667b85119c456d9478f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_UMAMI_SCRIPT_URL: ${{ vars.UMAMI_SCRIPT_URL }}
      VITE_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}

    steps:
      - name: Checkout canary
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # wrangler.canary.jsonc 只用整行 // 注释，去掉后按 JSON 解析。
      - name: Verify assets-first configuration
        run: >-
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('wrangler.canary.jsonc','utf8').replace(/^\s*\/\/.*$/gm,''));
          if(c.main!=='worker/static-site-not-found.ts'||c.assets?.binding||c.assets?.run_worker_first||fs.existsSync('worker/site/index.ts'))
          throw new Error('Real files must be served directly; only missing paths may invoke the 404 worker');
          if(c.assets?.not_found_handling!=='none')
          throw new Error('Missing scripts must return 404, never an immutable HTML fallback');
          if(c.assets?.directory!=='./dist-canary'||!c.routes?.some(r=>r.pattern==='friedsully.com/canary*')||c.workers_dev!==false)
          throw new Error('Canary must be served only from friedsully.com/canary* out of dist-canary')"

      - name: Build site
        run: pnpm run build

      - name: Verify build asset retention
        run: node --test scripts/prepare-retained-build-assets.test.mjs

      # 历史与正式站分开：两边部署路径不同，产物字节也不同。
      - name: Restore previous build assets
        id: retained-assets
        uses: actions/cache/restore@v4
        with:
          path: .cache/retained-build-assets
          key: site-assets-canary-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: site-assets-canary-v1-${{ github.ref_name }}-

      - name: Retain recent hashed build assets
        run: node scripts/prepare-retained-build-assets.mjs --dist dist --history .cache/retained-build-assets

      # 构建以 /canary/ 为部署路径，但产物仍在 dist/；挪进子目录，让完整请求路径对上文件。
      - name: Move build under canary/
        run: mkdir -p dist-canary && mv dist dist-canary/canary

      - name: Deploy static assets
        run: npx --yes wrangler@4.122.0 deploy --config wrangler.canary.jsonc

      - name: Save deployed build assets
        uses: actions/cache/save@v4
        with:
          path: .cache/retained-build-assets
          key: ${{ steps.retained-assets.outputs.cache-primary-key }}
