name: Deploy static site to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  # Do not interrupt a deployed release before its assets have been saved.
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      CLOUDFLARE_ACCOUNT_ID: 2cd975a0e2a9d667b85119c456d9478f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_UMAMI_SCRIPT_URL: ${{ vars.UMAMI_SCRIPT_URL }}
      VITE_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}

    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify assets-first configuration
        run: >-
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if(c.main!=='worker/static-site-not-found.ts'||c.assets?.binding||c.assets?.run_worker_first||fs.existsSync('worker/site/index.ts'))
          throw new Error('Real files must be served directly; only missing paths may invoke the 404 worker');
          if(c.assets?.not_found_handling!=='none')
          throw new Error('Missing scripts must return 404, never an immutable HTML fallback')"

      - name: Build site
        run: pnpm run build

      - name: Verify build asset retention
        run: node --test scripts/prepare-retained-build-assets.test.mjs

      # Separate history from Pages: its relative-base build has different bytes.
      # Merge only after the current SW manifest has been generated.
      - name: Restore previous build assets
        id: retained-assets
        uses: actions/cache/restore@v4
        with:
          path: .cache/retained-build-assets
          key: site-assets-cloudflare-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: site-assets-cloudflare-v1-${{ github.ref_name }}-

      - name: Retain recent hashed build assets
        run: node scripts/prepare-retained-build-assets.mjs --dist dist --history .cache/retained-build-assets

      - name: Deploy static assets
        run: npx --yes wrangler@4.122.0 deploy

      - name: Save deployed build assets
        uses: actions/cache/save@v4
        with:
          path: .cache/retained-build-assets
          key: ${{ steps.retained-assets.outputs.cache-primary-key }}
