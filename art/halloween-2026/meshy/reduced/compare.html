<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>万圣节减面对照</title><style>body{margin:0;background:#24212d;color:#f4ecff;font:15px system-ui}header{padding:16px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}h1{font-size:21px;margin:0}select,button{background:#42344e;color:white;border:1px solid #766081;border-radius:6px;padding:8px;font:inherit;cursor:pointer}main{display:grid;grid-template-columns:repeat(3,1fr)}section{min-width:0;border-right:1px solid #44394e;text-align:center}h2{font-size:17px;margin:12px 0 4px}p{margin:0;color:#c1b2cc}iframe{border:0;width:100%;height:calc(100vh - 178px);min-height:430px}footer{padding:8px 24px;color:#c1b2cc;font-size:13px}a{color:#e5c6ff}</style><header><h1>万圣节 · 减面对照</h1><select id="asset"><option value="pumpkin-costume">南瓜装</option><option value="ghost-top">幽灵上衣</option><option value="pumpkin-lantern">南瓜灯</option></select><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="back">背面</button></header><main></main><footer>三列使用相同灯光与材质，可分别拖动旋转、滚轮放大。服装面数包含随附人体，尚未完成换装适配。<a href="../viewer.html">完整模型工作台</a></footer><script type="module">
const manifest=await fetch('manifest.json').then(r=>r.json()),specs={'pumpkin-costume':[45000,34000],'ghost-top':[32000,24000],'pumpkin-lantern':[15000,12000]};
let generation=0;window.comparisonReady=false;
async function show(id){const token=++generation;window.comparisonReady=false;document.querySelector('main').replaceChildren();const rows=specs[id].map(target=>manifest.find(r=>r.id===id&&r.target===target)),choices=[{title:'原版',file:'halloween-batch-04-texture/'+id+'-smooth.glb',triangles:rows[0].originalTriangles},...rows.map((r,i)=>({title:i?'轻量候选':'保守减面',file:'reduced/'+r.file,...r,file:'reduced/'+r.file}))];
 await Promise.all(choices.map(async c=>{const section=document.createElement('section'),title=document.createElement('h2'),p=document.createElement('p'),frame=document.createElement('iframe');title.textContent=c.title;p.textContent=c.triangles.toLocaleString()+' 三角面'+(c.reductionPercent?' · 减少 '+c.reductionPercent+'%':'');section.append(title,p,frame);document.querySelector('main').append(section);await new Promise((resolve,reject)=>{frame.onload=resolve;frame.onerror=reject;frame.src='../viewer.html?model='+encodeURIComponent(c.file);});for(let i=0;i<300&&!frame.contentWindow.ready;i++)await new Promise(r=>setTimeout(r,100));if(!frame.contentWindow.ready)throw Error('Preview timeout');frame.contentDocument.querySelector('#ui').style.display='none';}));if(token===generation)window.comparisonReady=true;
}
document.querySelector('#asset').onchange=e=>show(e.target.value);for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{for(const f of document.querySelectorAll('iframe'))f.contentWindow.workbench.view(b.dataset.view);};window.showComparison=show;await show('pumpkin-costume');
</script></html>
