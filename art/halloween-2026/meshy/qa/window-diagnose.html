<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><style>body{margin:0;background:#ddd}header{display:flex;justify-content:space-around;padding:14px;font:18px sans-serif}</style><header><span>正常材质</span><span>仅颜色贴图</span><span>纯色几何</span></header><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';import {MeshoptDecoder} from 'three/examples/jsm/libs/meshopt_decoder.module.js';const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(1400,750);r.setClearColor('#ddd');r.toneMapping=T.ACESFilmicToneMapping;document.body.append(r.domElement);const scene=new T.Scene();scene.add(new T.HemisphereLight('#fff','#888',2));const l=new T.DirectionalLight('#fff',3);l.position.set(-3,6,7);scene.add(l);const c=new T.OrthographicCamera(-5,5,2.68,-2.68,.1,100);c.position.z=15;window.models=[];for(let i=0;i<3;i++){const root=(await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('/room3d/halloween_gothic_curtain_window.glb')).scene;root.traverse(o=>{if(!o.isMesh)return;const m=o.material;if(i===1)o.material=new T.MeshBasicMaterial({map:m.map,side:T.DoubleSide});if(i===2)o.material=new T.MeshStandardMaterial({color:'#ddd',side:T.DoubleSide});});const b=new T.Box3().setFromObject(root);root.position.sub(b.getCenter(new T.Vector3()));const g=new T.Group();g.add(root);g.scale.setScalar(.88);g.position.x=(i-1)*3.3;scene.add(g);window.models.push(g);}r.render(scene,c);window.ready=true;window.scene=scene;window.camera=c;window.renderer=r;
</script>
