<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><title>万圣节家具</title><style>body{margin:0;background:#e7e3ef}#labels{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);pointer-events:none}span{padding:18px;font:16px system-ui;color:#251a33}</style><div id="labels"></div><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';
const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(1400,1050);r.setClearColor('#e7e3ef');r.toneMapping=T.ACESFilmicToneMapping;document.body.append(r.domElement);const scene=new T.Scene();scene.add(new T.HemisphereLight('#ffffff','#8d8496',2));const l=new T.DirectionalLight('#ffffff',3);l.position.set(-3,6,7);scene.add(l);const camera=new T.OrthographicCamera(-5.6,5.6,4.2,-4.2,.01,100);camera.position.z=20;
const report=await fetch('furniture-texture-preview.json').then(r=>r.json());let i=0;for(const {entry:a,triangles}of report){const m=(await new GLTFLoader().loadAsync(a.previewUrl||('/room3d/'+a.url+'?v='+a.revision))).scene,b=new T.Box3().setFromObject(m),s=b.getSize(new T.Vector3());m.position.sub(b.getCenter(new T.Vector3()));const g=new T.Group();g.add(m);g.scale.setScalar(2.15/Math.max(s.x,s.y,s.z));g.rotation.set(.27,new URLSearchParams(location.search).has('back')?Math.PI+.4:.4,0);g.position.set(-4.2+i%4*2.8,2.6-Math.floor(i/4)*2.8,0);scene.add(g);document.querySelector('#labels').innerHTML+='<span>'+a.name+' · '+triangles+' 面</span>';i++;}r.render(scene,camera);window.ready=true;
</script>
