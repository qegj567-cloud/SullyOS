<!doctype html><meta charset="utf-8"><title>万圣节 SVG 贴图对照</title><link rel="icon" href="data:,"><style>body{margin:0;background:#e7e3ef;color:#241c30;font:15px system-ui}header{padding:18px;display:flex;align-items:center;gap:16px}select,button{font:inherit;padding:7px}main{display:flex}aside{width:28%;padding:16px;box-sizing:border-box}aside img{width:100%}article{width:72%;position:relative}.labels{display:flex;justify-content:space-around;margin:16px}canvas{width:100%}small{display:block;margin:12px 0;color:#665870}a{color:#6c328e}</style><header><strong>万圣节 · SVG 贴图对照</strong><select id="items"></select><button id="front">正面</button><button id="back">背面</button><a id="svg">SVG 源文件</a></header><main><aside><strong>设计参考</strong><img id="reference"><small>中间：Meshy 贴图。右侧：SVG 路径导出的贴图。两侧使用相同几何、UV、法线和粗糙度。</small></aside><article><div class="labels"><b>Meshy 贴图</b><b>SVG 描摹版</b></div><div id="view"></div></article></main><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';
const data=await fetch('svg-preview.json').then(r=>r.json()),r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(innerWidth*.72,650);r.setClearColor('#e7e3ef');r.toneMapping=T.ACESFilmicToneMapping;document.querySelector('#view').append(r.domElement);const scene=new T.Scene();scene.add(new T.HemisphereLight('#ffffff','#8d8496',2));const l=new T.DirectionalLight('#ffffff',3);l.position.set(-3,6,7);scene.add(l);const camera=new T.OrthographicCamera(-3.3,3.3,2.5,-2.5,.01,100);camera.position.z=20;let groups=[];const select=document.querySelector('#items');for(const [i,a]of data.entries())select.add(new Option(a.name,i));async function load(i){window.ready=false;for(const g of groups){scene.remove(g);g.traverse(o=>{if(o.isMesh){o.geometry.dispose();for(const m of Array.isArray(o.material)?o.material:[o.material]){for(const t of Object.values(m))if(t?.isTexture)t.dispose();m.dispose();}}});}groups=[];const a=data[i];document.querySelector('#reference').src=a.reference;document.querySelector('#svg').href=a.svg;for(const [j,url]of [a.original,a.model].entries()){const m=(await new GLTFLoader().loadAsync(url)).scene,b=new T.Box3().setFromObject(m),s=b.getSize(new T.Vector3());m.position.sub(b.getCenter(new T.Vector3()));const g=new T.Group();g.add(m);g.scale.setScalar(2.8/Math.max(s.x,s.y,s.z));g.position.x=j?1.65:-1.65;g.rotation.set(.27,.4,0);groups.push(g);scene.add(g);}r.render(scene,camera);window.ready=true;}select.onchange=()=>load(+select.value);document.querySelector('#front').onclick=()=>{groups.forEach(g=>g.rotation.set(.27,.4,0));r.render(scene,camera);};document.querySelector('#back').onclick=()=>{groups.forEach(g=>g.rotation.set(.27,Math.PI+.4,0));r.render(scene,camera);};await load(0);
</script>
