<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>万圣节六款 · 统一验收</title>
<style>*{box-sizing:border-box}body{margin:0;background:#24212d;color:#f5eafa;font:14px system-ui}header{padding:18px 24px;border-bottom:1px solid #574360}h1{font-size:20px;margin:0 0 8px}p{color:#cfbdd5;margin:7px 0}button,select,a{font:inherit;color:inherit;background:#443450;border:1px solid #786082;border-radius:6px;padding:7px 11px;margin:3px;text-decoration:none}button[aria-current=true]{background:#ad5426;border-color:#f6a25f}main{height:calc(100vh - 166px);min-height:500px;display:grid;grid-template-columns:minmax(260px,38%) 1fr}figure{margin:0;position:relative;background:#29242f;display:flex;align-items:center;justify-content:center}figure img{width:100%;height:100%;object-fit:contain}figcaption{position:absolute;top:12px;left:18px;color:#cfbdd5}iframe{width:100%;height:100%;border:0}#parts{display:flex;gap:12px;flex-wrap:wrap;padding:10px 24px;border-top:1px solid #574360}#parts label{cursor:pointer}#stats{font-size:12px;margin-left:12px;color:#cfbdd5}@media(max-width:700px){header{padding:12px}main{grid-template-columns:1fr;height:auto}figure{height:44vh}iframe{height:65vh}#parts{padding:12px}}</style>
<header><h1>万圣节六款 · 参考图与实际试穿</h1><div id="outfits"></div><div><label>配色 <select id="palette" aria-label="预设配色"></select></label><select id="pose"><option value="bind">T 姿势 · 对照参考</option><option value="costume">站立</option><option value="reference">垂手</option><option value="arm">抬手</option><option value="knee">抬腿</option><option value="head">转头</option></select><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="back">背面</button><button id="body">显示／隐藏素体</button><a id="detail" target="_blank">完整试穿页</a><span id="stats"></span></div></header>
<main><figure><figcaption>设计参考</figcaption><img id="reference" alt="万圣节服装设计参考"></figure><iframe id="model" title="当前项目素体实际试穿"></iframe></main><div id="parts"></div>
<script type="module">
import {presetsFor} from './color-presets.js';
const palette=document.querySelector('#palette');let paletteId=new URLSearchParams(location.search).get('palette')||'original';
const designs=[['witch','南瓜女巫','01-pumpkin-witch'],['count','蝙蝠伯爵','02-bat-count'],['apprentice','药剂学徒','03-potion-apprentice'],['shorts','糖果短裤','04-halloween-shorts'],['ghost','幽灵装','05-ghost-costume'],['pumpkin','南瓜装','06-pumpkin-costume']];
const frame=document.querySelector('#model');let current;
function ready(){return frame.contentWindow?.fitting;}
function pose(){if(!ready())return;frame.contentDocument.querySelector('#pose').value=document.querySelector('#pose').value;ready().update();}
async function select(id){window.ready=false;current=designs.find(x=>x[0]===id)||designs[0];document.querySelector('#reference').src='../../outfits/'+current[2]+'.png';document.querySelector('#detail').href='index.html?outfit='+current[0]+'&palette='+paletteId;palette.replaceChildren();for(const p of presetsFor(current[0])){const o=document.createElement('option');o.value=p.id;o.textContent=p.name;palette.append(o);}palette.value=paletteId;if(!palette.value){paletteId='original';palette.value=paletteId;}document.querySelectorAll('[data-outfit]').forEach(b=>b.setAttribute('aria-current',b.dataset.outfit===current[0]));document.querySelector('#parts').textContent='载入模型…';frame.src='index.html?outfit='+current[0]+'&review=1&palette='+paletteId;history.replaceState(null,'','?outfit='+current[0]+'&palette='+paletteId);}
for(const [id,label]of designs){const b=document.createElement('button');b.textContent=label;b.dataset.outfit=id;b.onclick=()=>select(id);document.querySelector('#outfits').append(b);}
frame.onload=async()=>{for(let i=0;i<120&&!frame.contentWindow.ready;i++)await new Promise(r=>setTimeout(r,250));if(!ready()){document.querySelector('#parts').textContent='模型未完成载入，请打开完整试穿页查看。';return;}pose();document.querySelector('#parts').replaceChildren();for(const input of frame.contentDocument.querySelectorAll('[data-part]')){const label=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=true;c.onchange=()=>{input.checked=c.checked;input.onchange();};label.append(c,document.createTextNode(input.parentElement.textContent));document.querySelector('#parts').append(label);}document.querySelector('#stats').textContent=frame.contentDocument.querySelector('#stats').textContent.replace('\n',' · ');window.ready=true;};
palette.onchange=()=>{paletteId=palette.value;ready()?.setPalette(paletteId);history.replaceState(null,'','?outfit='+current[0]+'&palette='+paletteId);document.querySelector('#detail').href='index.html?outfit='+current[0]+'&palette='+paletteId;};
document.querySelector('#pose').onchange=pose;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>ready()?.view(b.dataset.view));document.querySelector('#body').onclick=()=>{if(!ready())return;const c=frame.contentDocument.querySelector('#body');c.checked=!c.checked;ready().update();};select(new URLSearchParams(location.search).get('outfit')||'witch');
</script></html>
