<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>万圣节模型工作台</title><style>body{margin:0;background:#24212d;color:#fff;font:14px system-ui}#ui{position:fixed;top:16px;left:18px;z-index:2;max-width:300px}button,select{font:inherit;padding:6px;margin:3px}#info{white-space:pre-line}canvas{display:block}</style><div id="ui"><h2>万圣节 · Meshy 首批模型</h2><select id="model"><option>pumpkin-costume</option><option>ghost-costume</option><option>pumpkin-lantern</option></select><select id="part"><option value="all">全部部件</option></select><div><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="back">背面</button></div><p id="info"></p></div><script type="module">
import * as T from '/node_modules/three/build/three.module.js';
import {GLTFLoader} from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';
import {OrbitControls} from '/node_modules/three/examples/jsm/controls/OrbitControls.js';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.setClearColor('#24212d');document.body.appendChild(renderer.domElement);
const scene=new T.Scene();scene.add(new T.HemisphereLight(0xffffff,0x888298,2.5));const key=new T.DirectionalLight(0xffffff,2.5);key.position.set(-3,5,6);scene.add(key);
const camera=new T.PerspectiveCamera(32,innerWidth/innerHeight,.001,100),controls=new OrbitControls(camera,renderer.domElement);let current,center=new T.Vector3(),span=1;
const render=()=>renderer.render(scene,camera);controls.addEventListener('change',render);
const choices=[['halloween-batch-04-texture/pumpkin-costume-textured.glb','高精度 · 南瓜装贴图'],['halloween-batch-04-texture/ghost-top-textured.glb','高精度 · 幽灵上衣贴图'],['halloween-batch-04-texture/pumpkin-lantern-textured.glb','高精度 · 南瓜灯贴图'],['halloween-batch-03/pumpkin-costume-hd.glb','高精度 · 南瓜装白模'],['halloween-batch-03/ghost-top-hd.glb','高精度 · 幽灵上衣白模'],['halloween-batch-03/pumpkin-lantern-hd.glb','高精度 · 南瓜灯白模'],['fitted-socks/ghost-socks.glb','贴腿母版 · 橙紫袜'],['fitted-socks/pumpkin-socks.glb','贴腿母版 · 橙黑袜']];
choices.unshift(...[['pumpkin-costume','南瓜装'],['ghost-top','幽灵上衣'],['pumpkin-lantern','南瓜灯']].map(([id,label])=>['halloween-batch-04-texture/'+id+'-smooth.glb','高精度 · '+label+' / 柔和材质']));
const reductions=await fetch('reduced/manifest.json').then(r=>r.ok?r.json():[]).catch(()=>[]);choices.unshift(...reductions.map(r=>['reduced/'+r.file,`${{ 'pumpkin-costume':'南瓜装','ghost-top':'幽灵上衣','pumpkin-lantern':'南瓜灯'}[r.id]} · 减面 ${r.triangles.toLocaleString()} 面`]));
const selector=document.querySelector('#model');for(const [value,label]of choices)selector.add(new Option(label,value));document.querySelector('h2').textContent='万圣节 · 模型候选对照';
function view(name){const size=new T.Box3().setFromObject(current).getSize(new T.Vector3()),distance=Math.max(size.y,(name==='side'?size.z:size.x)/camera.aspect)*2.1;camera.position.copy(center).add(new T.Vector3(name==='side'?distance:0,0,name==='back'?-distance:name==='side'?0:distance));controls.target.copy(center);controls.update();render();}
async function load(id){if(current){scene.remove(current);current.traverse(o=>{o.geometry?.dispose();o.material?.dispose();});}current=(await new GLTFLoader().loadAsync(id.endsWith('.glb')?id:id+'-parts.glb')).scene;scene.add(current);if(id.includes('fitted.glb')){const {createLayeredClothingMasks}=await import('/apps/room3d/chibi/garmentLayering.ts');let skin;const clothes=[];current.traverse(o=>{if(o.isSkinnedMesh){if(o.name==='CurrentBody')skin=o;else clothes.push(o);}});current.updateMatrixWorld(true);skin.skeleton.update();const result=createLayeredClothingMasks(clothes,[skin],skin.skeleton,1,true);if(result.masks[0])skin.geometry=result.masks[0].geometry;}const box=new T.Box3().setFromObject(current);box.getCenter(center);const size=box.getSize(new T.Vector3());span=Math.max(size.x,size.y,size.z);document.querySelector('#part').innerHTML='<option value="all">全部部件</option>'+current.children.map(o=>`<option>${o.name}</option>`).join('');document.querySelector('#info').textContent=`${current.children.length} 个连通部件`;view('front');window.ready=true;return current;}
document.querySelector('#model').onchange=e=>load(e.target.value);document.querySelector('#part').onchange=e=>{current.traverse(o=>{if(o.isMesh)o.visible=e.target.value==='all'||o.name===e.target.value;});render();};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));
const originalLoad=load;
load=async id=>{await originalLoad(id);if(id.includes('fitted-socks/')){const body=(await new GLTFLoader().loadAsync('current-body.glb')).scene;const {createClothingMask}=await import('/apps/room3d/chibi/clothingMask.ts');body.traverse(o=>{if(o.isSkinnedMesh){if(!o.geometry.groups.length)o.geometry.addGroup(0,o.geometry.index.count,0);o.geometry=createClothingMask(o.geometry,p=>p.y<.90,-Infinity);}});current.add(body);const box=new T.Box3().setFromObject(current);box.getCenter(center);span=Math.max(...box.getSize(new T.Vector3()).toArray());}let faces=0;const parts=[];current.traverse(o=>{if(o.isMesh){parts.push(o);faces+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;}});const select=document.querySelector('#part');select.replaceChildren(new Option('全部部件','all'));parts.forEach(o=>select.add(new Option(o.name,o.name)));if(choices.some(c=>c[0]===id))selector.value=id;document.querySelector('#info').textContent=`${choices.find(c=>c[0]===id)?.[1]||id}\n${faces.toLocaleString()} 三角面 · ${parts.length} 个网格\n制作候选，尚未加入正式衣橱`;view('front');return current;};
window.workbench={load,view,scene,render,get current(){return current;}};await load(new URLSearchParams(location.search).get('model')||'halloween-batch-03/pumpkin-costume-hd.glb');
</script></html>
