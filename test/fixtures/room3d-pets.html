<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>九只小宠物 · 配色预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f1eb;color:#333b35;font:14px system-ui,sans-serif}header{padding:24px 28px 14px}h1{margin:0 0 6px;font-size:24px}header p{margin:0;color:#788174}main{display:grid;grid-template-columns:1fr 270px;gap:18px;padding:10px 28px 28px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}figure{margin:0;position:relative;background:#e7e9e1;border:1px solid #dce0d5;border-radius:14px;overflow:hidden}figure[aria-selected=true]{outline:2px solid #718672;outline-offset:2px}.viewport{height:260px;cursor:grab;touch-action:none}figcaption{display:flex;justify-content:space-between;padding:12px 16px;background:#f8f8f2;font-weight:600}figcaption small{font-weight:400;color:#828a7d}canvas{position:fixed;inset:0;pointer-events:none;z-index:1}aside{position:relative;z-index:2;padding:18px;background:#fffdf6;border-radius:14px;align-self:start}aside h2{font-size:18px;margin:0 0 10px}button{font:inherit;cursor:pointer;background:#f3f3eb;border:1px solid #dfe2d6;border-radius:8px;color:inherit;padding:7px 9px}button[aria-pressed=true]{border-color:#718672;background:#e8eedf}.h3-color-presets{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:16px}.h3-color-presets button{font-size:12px;text-align:left}.h3-preset-dots{display:flex;margin-bottom:5px}.h3-preset-dots i{width:12px;height:12px;border-radius:50%;border:1px solid #0001}.h3-swatches{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}.h3-swatches button:not(.reset){width:24px;height:24px;border-radius:50%;padding:0}.reset{font-size:11px}.h3-custom-color{display:flex;align-items:center;justify-content:space-between;margin:10px 0}.h3-custom-color input{width:40px;height:26px;padding:1px;border:0;background:none}.tip{font-size:12px;color:#798273;line-height:1.6;margin:16px 0 0}@media(max-width:800px){main{grid-template-columns:1fr;padding:10px 16px}.gallery{grid-template-columns:repeat(2,1fr)}.viewport{height:210px}aside{width:100%}heade </style></head><body><header><h1>九只小宠物</h1><p>纯色材质 · 基础模型低于 4000 三角面 · 72 套配色</p></header><canvas></canvas><main><section class="gallery"></section><aside><h2></h2><div id="paint"></div><p class="tip">点击选择宠物，拖动查看侧面与背面。此页用于素材预览；房间中的配色会跟随各自的实例保存。</p></aside></main><script type="module" src="./room3d-pets.js"></script></body></html>
